<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover Link Preview – Options</title>
<style>
  body { font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  fieldset { border: 1px solid #d0d7de; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; margin: 6px 0; }
  input[type=number] { width: 70px; }
  textarea { width: 100%; height: 130px; box-sizing: border-box; font: 13px ui-monospace, Menlo, monospace; }
  .hint { color: #57606a; font-size: 12px; margin-top: 4px; }
  button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid #1f6feb; background: #0969da; color: #fff; cursor: pointer; }
  #status { margin-left: 12px; color: #1a7f37; }
  #status.err { color: #cf222e; }
</style>
</head>
<body>
<h1>Hover Link Preview</h1>

<fieldset>
  <legend>General</legend>
  <label><input type="checkbox" id="enabled"> Enabled</label>
  <label><input type="checkbox" id="keepOnScreen"> Keep popup on screen after the mouse leaves
    <div class="hint">On: popup stays until you close it (✕ or Esc); hovering another link opens an additional popup. Off: popup closes when the mouse leaves the link and the popup.</div></label>
  <label>Hover delay: <input type="number" id="delaySec" min="1" max="30" step="1"> seconds (1–30)</label>
</fieldset>

<fieldset>
  <legend>Popup size</legend>
  <label><input type="radio" name="size" value="small"> Small (360 × 270)</label>
  <label><input type="radio" name="size" value="medium"> Medium (480 × 360)</label>
  <label><input type="radio" name="size" value="large"> Large (640 × 480)</label>
  <label><input type="radio" name="size" value="xl"> XL (800 × 600)</label>
</fieldset>

<fieldset>
  <legend>Domains (link destination)</legend>
  <label><input type="radio" name="listMode" value="deny"> Everywhere <b>except</b> the domains below</label>
  <label><input type="radio" name="listMode" value="allow"> <b>Only</b> the domains below</label>
  <textarea id="domains" spellcheck="false" placeholder="example.com&#10;mail.google.com"></textarea>
  <div class="hint">One domain per line. Subdomains are included. Lines starting with # are ignored.</div>
</fieldset>

<button id="save" type="button">Save</button><span id="status"></span>
<script src="options.js"></script>
</body>
</html>
